name: Daily edition

# 07:00 Singapore time (UTC+8) = 23:00 UTC the previous day.
#
# Singapore does not observe daylight saving and has not changed its offset
# since 1982, so a fixed UTC cron is safe here — no seasonal drift to correct.
#
# GitHub's scheduled runners are best-effort and can lag by several minutes
# under load. The job therefore starts at 22:45 UTC, giving roughly fifteen
# minutes of slack before 7am SGT. The edition is dated inside the engine from
# the Singapore clock, so a late start still produces the correct date.
on:
  schedule:
    - cron: '45 22 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Send only to the test address'
        type: boolean
        default: true
      no_send:
        description: 'Build and store, send nothing'
        type: boolean
        default: false

concurrency:
  # Never let two runs build the same edition at once.
  group: daily-edition
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: engine/requirements.txt

      - name: Install dependencies
        run: pip install -r engine/requirements.txt

      - name: Build and send the edition
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL }}
          NEXT_PUBLIC_CONTACT_EMAIL: ${{ secrets.NEXT_PUBLIC_CONTACT_EMAIL }}
          LLM_PROVIDER: ${{ vars.LLM_PROVIDER || 'gemini' }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-3.7-flash' }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: ${{ vars.GROQ_MODEL || 'llama-3.3-70b-versatile' }}
          EMAIL_PROVIDER: ${{ vars.EMAIL_PROVIDER || 'brevo' }}
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_FROM_NAME: ${{ vars.EMAIL_FROM_NAME || 'The 7000' }}
          EMAIL_FROM_ADDRESS: ${{ secrets.EMAIL_FROM_ADDRESS }}
          EMAIL_REPLY_TO: ${{ secrets.EMAIL_REPLY_TO }}
          EMAIL_TEST_RECIPIENT: ${{ secrets.EMAIL_TEST_RECIPIENT }}
          LOOKBACK_DAYS: ${{ vars.LOOKBACK_DAYS || '30' }}
          MAX_PER_COUNTRY: ${{ vars.MAX_PER_COUNTRY || '3' }}
          # Repository variable, not a secret, so it can be flipped in the UI
          # without rotating anything. Keep it 'true' until you have reviewed a
          # few real editions; then set it to 'false' to go live.
          DRY_RUN_SEND: ${{ vars.DRY_RUN_SEND || 'true' }}
        run: |
          ARGS=""
          if [ "${{ inputs.dry_run }}" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          if [ "${{ inputs.no_send }}" = "true" ]; then ARGS="$ARGS --no-send"; fi
          python engine/run_daily.py --preview edition-preview.html $ARGS

      - name: Upload the rendered edition
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: edition-preview
          path: edition-preview.html
          # Long enough to investigate a bad edition, short enough not to hoard.
          retention-days: 14
          if-no-files-found: ignore
